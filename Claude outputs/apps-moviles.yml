# Compila la app para Android (APK) e iOS automáticamente en GitHub.
# Se ejecuta en cada push a main o manualmente (pestaña Actions → Run workflow).
# Además de quedar en "Artifacts", el APK (y el build de iOS) se publican
# como una Release llamada "latest" con un link de descarga directo.
name: Apps móviles (Android + iOS)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecoclasifica-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - name: Build web + sync Android
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build && npx cap sync android
      - name: Compilar APK (debug)
        working-directory: ecoclasifica-web/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EcoClasifica-android-apk
          path: ecoclasifica-web/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ecoclasifica-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Build web + sync iOS
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build && npx cap sync ios
      - name: Compilar para simulador (sin firma)
        working-directory: ecoclasifica-web/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: EcoClasifica-ios-simulador
          path: ecoclasifica-web/ios/App/build/Build/Products/Debug-iphonesimulator/App.app

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar APK de Android
        uses: actions/download-artifact@v4
        with:
          name: EcoClasifica-android-apk
          path: android-apk
      - name: Descargar app de iOS (simulador)
        uses: actions/download-artifact@v4
        with:
          name: EcoClasifica-ios-simulador
          path: ios-app
      - name: Comprimir app de iOS
        run: |
          cd ios-app
          zip -r ../EcoClasifica-ios-simulador.zip .
      - name: Localizar APK
        id: apk
        run: echo "path=$(find android-apk -name '*.apk' | head -1)" >> "$GITHUB_OUTPUT"
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última versión (build automático)
          body: |
            Compilación automática desde el último push a main.

            - **Android**: descarga el `.apk` e instálalo (activa "Instalar apps de fuentes desconocidas" en tu teléfono).
            - **iOS**: build sin firmar, solo para el Simulador de Xcode. No es instalable en un iPhone real sin una cuenta de desarrollador de Apple paga.
          files: |
            ${{ steps.apk.outputs.path }}
            EcoClasifica-ios-simulador.zip
