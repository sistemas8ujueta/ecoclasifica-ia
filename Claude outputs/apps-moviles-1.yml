# Compila la app para Android (APK) automáticamente en GitHub.
# Se ejecuta en cada push a main o manualmente (pestaña Actions → Run workflow).
# El APK se publica como una Release llamada "latest" con un link de
# descarga directo (no hace falta iniciar sesión en GitHub).
name: App Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecoclasifica-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - name: Build web + sync Android
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build && npx cap sync android
      - name: Compilar APK (debug)
        working-directory: ecoclasifica-web/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EcoClasifica-android-apk
          path: ecoclasifica-web/android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar APK de Android
        uses: actions/download-artifact@v4
        with:
          name: EcoClasifica-android-apk
          path: android-apk
      - name: Localizar APK
        id: apk
        run: echo "path=$(find android-apk -name '*.apk' | head -1)" >> "$GITHUB_OUTPUT"
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última versión (build automático)
          body: |
            Compilación automática desde el último push a main.

            - **Android**: descarga el `.apk` e instálalo (activa "Instalar apps de fuentes desconocidas" en tu teléfono).
          files: |
            ${{ steps.apk.outputs.path }}
